body::before{
  content:"";position:fixed;inset:0;z-index:50;pointer-events:none;
  background:radial-gradient(circle at center,transparent 30%,rgba(0,0,0,.65) 100%);
}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .8s ease,visibility .8s ease;z-index:2}
.screen.active{opacity:1;visibility:visible}
/* CAPA */
.card{
  width:min(410px,72vw);aspect-ratio:2/3;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:linear-gradient(145deg,#030303,#190000 50%,#050303);
  border:1px solid rgba(170,0,0,.9);
  box-shadow:0 0 0 8px rgba(0,0,0,.45),0 0 70px rgba(120,0,0,.35);
}
.card::before,.card::after{content:"";position:absolute;inset:13px;border:1px solid rgba(160,0,0,.55);pointer-events:none}
.card::after{inset:25px;border-color:rgba(120,0,0,.35)}
.card small{font-size:10px;letter-spacing:.38em;color:#9d8d88;margin-bottom:30px}
.card h1{
  font-family:'Cinzel Decorative',Georgia,serif;color:#c50000;
  font-size:clamp(38px,8vw,70px);letter-spacing:.12em;margin:0 0 42px;
  text-shadow:0 0 25px rgba(190,0,0,.25)
}
button{font-family:inherit}
.ler{
  position:relative;z-index:3;cursor:pointer;color:#eee7df;background:#080606;
  border:1px solid #a00000;padding:12px 42px;letter-spacing:.35em;
  transition:.25s;box-shadow:0 0 20px rgba(160,0,0,.18)
}
.ler:hover{background:#210000;box-shadow:0 0 35px rgba(180,0,0,.35);transform:translateY(-1px)}
/* INTRO */
.introWrap{width:min(900px,88vw);height:78vh;overflow:hidden;text-align:center;position:relative}
.typeArea{
  width:100%;height:100%;padding:7vh 3vw 22vh;
  display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;
  mask-image:linear-gradient(to bottom,transparent 0%,black 18%,black 100%);
}
.typeLine{
  margin:9px auto;font-size:clamp(16px,2.15vw,25px);line-height:1.65;
  letter-spacing:.035em;text-shadow:0 2px 16px #000;
  transition:opacity .8s ease,transform .8s ease
}
.typeLine.emphasis{
  color:#d00000;font-family:'Cinzel Decorative',Georgia,serif;
  font-weight:700;letter-spacing:.08em;margin:14px auto
}
.cursor{display:inline-block;width:7px;height:1em;background:#a60000;vertical-align:-.1em;animation:blink .8s infinite}
@keyframes blink{50%{opacity:0}}
/* QUESTIONS */
.questionWrap{width:min(1000px,90vw);text-align:center;padding:0 2vw}
.progress{font-size:10px;letter-spacing:.5em;color:#8c7772;margin-bottom:28px}
.questionText{
  max-width:930px;margin:0 auto 38px;
  font-family:'Cinzel Decorative',Georgia,serif;
  font-size:clamp(19px,2.6vw,32px);line-height:1.55;font-weight:500;
  text-shadow:0 3px 18px #000;
}
.answerBox{
  width:min(780px,92vw);min-height:125px;resize:none;outline:none;
  display:block;margin:auto;background:rgba(0,0,0,.48);color:#eee7df;
  border:1px solid rgba(100,0,0,.3);border-bottom:1px solid #a00000;
  padding:17px 20px;font-size:16px;line-height:1.65;text-align:left;
  box-shadow:0 12px 35px rgba(0,0,0,.28)
}
.answerBox::placeholder{color:#786867;font-style:italic}
.nav{display:flex;justify-content:center;gap:14px;margin-top:27px}
.nav button{
  cursor:pointer;color:#d9d0ca;background:rgba(0,0,0,.62);
  border:1px solid #650000;padding:10px 25px;letter-spacing:.2em
}
.nav button:hover{border-color:#c00000;color:#fff}
.nav .next{background:#580000;border-color:#a00000}
#nameScreen .questionWrap{display:flex;flex-direction:column;align-items:center;gap:0}
.namePrompt{color:#c40000;max-width:900px;margin:0 auto 34px;font-family:'Cinzel Decorative',Georgia,serif;font-size:clamp(20px,3vw,34px);line-height:1.5;font-weight:500;text-shadow:0 3px 18px #000}
.nameInput{width:min(620px,88vw);background:rgba(0,0,0,.48);color:#eee7df;border:0;border-bottom:1px solid #a00000;outline:none;padding:14px 8px;text-align:center;font-family:Cinzel,Georgia,serif;font-size:20px;letter-spacing:.08em;box-shadow:0 12px 35px rgba(0,0,0,.22)}
.nameInput::placeholder{color:#786867;font-style:italic}
.finish{display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;min-height:70vh;padding:28px}
.finish h2{font-family:'Cinzel Decorative';color:#c40000;letter-spacing:.12em}
.finish p{font-size:15px;color:#c5b9b4;margin:0}
.finish .thanks{font-family:'Cinzel Decorative',Georgia,serif;color:#c40000;font-size:clamp(18px,3vw,28px);letter-spacing:.08em}
.finish .alguemMsg{font-family:Georgia,serif;color:#ddd3cf;font-size:clamp(16px,2.6vw,23px);line-height:1.55;max-width:680px}
.finish .alguemMsg span{color:#c40000}
#finalPulse{position:fixed;inset:0;background:rgba(120,0,0,.0);pointer-events:none;z-index:60;opacity:0}
#finalPulse.active{animation:finalHeart .78s ease-in-out infinite}
@keyframes finalHeart{0%,100%{opacity:0}45%{opacity:.07}50%{opacity:.18}56%{opacity:.07}62%{opacity:.13}70%{opacity:0}}
#exitBtn.pulsing{animation:buttonHeart .78s ease-in-out infinite;box-shadow:0 0 22px rgba(150,0,0,.18)}
@keyframes buttonHeart{0%,100%{transform:scale(1);opacity:.72}45%{transform:scale(1.02);opacity:.88}50%{transform:scale(1.055);opacity:1;box-shadow:0 0 30px rgba(170,0,0,.35)}56%{transform:scale(1.018);opacity:.86}62%{transform:scale(1.04);opacity:.94}70%{transform:scale(1);opacity:.72}}
#exitBtn{background:rgba(80,80,80,.16);border:1px solid rgba(190,185,181,.2);color:rgba(225,218,214,.72);padding:9px 20px;border-radius:999px;font-family:Georgia,serif;font-size:10px;letter-spacing:.28em;cursor:pointer;transition:.2s}
#exitBtn:hover{background:rgba(120,120,120,.22)}

.musicLabel{
  position:fixed;left:18px;bottom:16px;z-index:70;font-size:8px;
  letter-spacing:.28em;color:#796967;opacity:.8
}
#player{position:fixed;width:1px;height:1px;left:-20px;top:-20px;border:0;opacity:0;pointer-events:none}
.continueHint{position:fixed;bottom:clamp(88px,12vh,125px);left:50%;transform:translateX(-50%);text-align:center;font-size:9px;letter-spacing:.25em;color:rgba(220,214,210,.62);background:rgba(95,95,95,.16);border:1px solid rgba(190,185,181,.12);border-radius:999px;padding:8px 14px;box-shadow:0 5px 20px rgba(0,0,0,.18);opacity:0;transition:opacity .5s ease;pointer-events:none;white-space:nowrap}.continueHint.visible{opacity:.72}.finish{position:relative}
@media(max-width:600px){
  .questionText{font-size:18px;line-height:1.5}
  .typeLine{font-size:14px}
  .answerBox{min-height:110px}
}
.finish #exitBtn{margin-top:18px;padding:10px 28px;background:transparent;color:#c40000;border:1px solid rgba(196,0,0,.65);font-family:inherit;letter-spacing:.25em;cursor:pointer;animation:exitPulse 1.05s ease-in-out infinite;}
@keyframes exitPulse{0%,100%{opacity:.55;box-shadow:0 0 0 rgba(180,0,0,0)}50%{opacity:1;box-shadow:0 0 22px rgba(180,0,0,.28)}}
#blackout{position:fixed;inset:0;background:#000;z-index:999;display:none;align-items:center;justify-content:center;}
#blackout.active{display:flex;}
</style>
</head>
<body>
<audio id="localMusic" src="seis-noites.mp3" preload="auto" loop playsinline></audio>

<section id="cover" class="screen active">
  <div class="card">
    <small>UM QUESTIONÁRIO PARA</small>
    <h1>ALGUÉM</h1>
    <button class="ler" id="lerBtn">LER</button>
  </div>
</section>

<section id="intro" class="screen">
  <div class="introWrap">
    <div id="typeArea" class="typeArea"></div><div id="continueHint" class="continueHint">TOQUE PARA CONTINUAR</div>
  </div>
</section>

<section id="questions" class="screen">
  <div class="questionWrap">
    <div id="progress" class="progress">01 / 06</div>
    <div id="questionText" class="questionText"></div>
    <textarea id="answerBox" class="answerBox" placeholder="Escreva sua resposta..." autocomplete="off"></textarea>
    <div class="nav">
      <button id="backBtn">VOLTAR</button>
      <button id="nextBtn" class="next">CONTINUAR</button>
    </div>
  </div>
</section>

<section id="nameScreen" class="screen">
  <div class="questionWrap">
    <div class="progress">IDENTIFICAÇÃO</div>
    <div class="namePrompt">Nome do Jogador</div>
    <input id="nameInput" class="nameInput" type="text" maxlength="80" placeholder="Seu nome..." autocomplete="name">
    <div class="nav">
      <button id="nameBackBtn">VOLTAR</button>
      <button id="nameNextBtn" class="next">CONTINUAR</button>
    </div>
  </div>
</section>

<section id="finish" class="screen">
  <div class="finish">
    <div class="thanks">Obrigado por responder.</div>
    <button id="exitBtn">SAIR</button>
    
  </div>
</section>
<div id="finalPulse"></div>
<div id="blackout"></div>

<div id="musicLabel" class="musicLabel">6 NOITES · ORDEM PARANORMAL</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// SUPABASE — projeto Responder anônimo
const SUPABASE_URL = "https://kaujeiodvpjjfrwqfmsx.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_nZd-iUk1cVYuk-L1YQJobA_H-nWxqJ7";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

async function saveResponseToSupabase(){
  const { error } = await supabaseClient
    .from("respostas")
    .insert({
      nome: participantName,
      resposta_1: answers[0],
      resposta_2: answers[1],
      resposta_3: answers[2],
      resposta_4: answers[3],
      resposta_5: answers[4],
      resposta_6: answers[5]
    });
  if(error) throw error;
}

const introLines = [
  ["Você responderá a perguntas que não foram feitas para você.", false],
  ["São perguntas destinadas a Alguém.", false],
  ["As respostas que escrever não representam você, mas elas representam Alguém.", false],
  ["Apesar de suas respostas representarem Alguém, esse Alguém não representa você.", false],
  ["Seu Alguém não tem um rosto nem um nome, apenas obsessões.", false],
  ["NÃO PENSE EM UM ROSTO.", true],
  ["NÃO PENSE EM UM NOME.", true],
  ["APENAS MOMENTOS E SENTIMENTOS.", true],
  ["RESPONDA.", true]
];

const questions = [
"Qual sua relação com a Ordem? Por que você luta? Colocar sua vida em risco, se submeter a uma hierarquia, cumprir missões e objetivos. Por você? Pelos outros? Por algo maior? Ou simplesmente se enxerga como algo tão inferior e insignificante?",
"Qual foi o maior erro que você já cometeu? A mancha que nunca desaparece? O tormento que persegue seus sonhos inquietos?",
"O que é imperdoável? Algo que você nunca seria capaz de fazer, e desprezaria qualquer um responsável por isso? Qual sua relação com esse ato?",
"Tudo começa pelo Sangue. Como foi a primeira vez que você encontrou o Sangue?",
"O que mais gosta de fazer? Qual sua lembrança mais agradável? O que conforta seus sentimentos em momentos de horror?",
"Qual seu maior desejo? Sua tentação secreta, interna, mais profunda e escura. O que você verdadeiramente deseja acima de todas as coisas?"
];

let index = 0;
const answers = new Array(6).fill("");
let participantName = "";
let questionsCompleted = false;
let flowStage = "name";
const $ = id => document.getElementById(id);

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
}

function startMusic() {
  const music = $("localMusic");
  if (!music) return;
  music.src = "seis-noites.mp3";
  music.loop = true;
  music.preload = "auto";
  music.volume = 0.72;
  music.play().catch(() => {});
}

document.addEventListener("pointerdown", () => {
  const music = $("localMusic");
  if (music && music.paused) music.play().catch(() => {});
}, { passive: true });

let introLineIndex = 0;
let introTyping = false;
let introFinished = false;

function typeIntroLine(done) {
  const area = $("typeArea");
  const [text, emphasis] = introLines[introLineIndex];
  const current = document.createElement("div");
  current.className = "typeLine" + (emphasis ? " emphasis" : "");
  area.appendChild(current);
  introTyping = true;
  let char = 0;
  function tick(){
    current.innerHTML = text.slice(0,char+1) + '<span class="cursor"></span>';
    char++;
    const lines=[...area.querySelectorAll(".typeLine")];
    lines.forEach((el,i)=>{const d=lines.length-1-i; el.style.opacity=d>=4?"0":String(1-d*.18);});
    if(char<text.length){ setTimeout(tick,32); }
    else {
      current.textContent=text;
      introTyping=false;
      $("continueHint").classList.add("visible");
      if(done) done();
    }
  }
  tick();
}

function typeIntro() {
  $("typeArea").innerHTML="";
  $("continueHint").classList.remove("visible");
  introLineIndex=0; introFinished=false; introTyping=false;
  typeIntroLine();
}

$("intro").addEventListener("click",()=>{
  // A introdução é uma etapa própria. Ela nunca pode cair diretamente
  // na tela final/respiração.
  if(introTyping || introFinished) return;
  $("continueHint").classList.remove("visible");
  if(introLineIndex < introLines.length-1){
    introLineIndex++;
    typeIntroLine();
  } else {
    introFinished=true;
    flowStage="questions";
    setTimeout(()=>{
      show("questions");
      renderQuestion();
      $("answerBox").focus();
    },220);
  }
});

function renderQuestion() {
  $("progress").textContent = String(index + 1).padStart(2,"0") + " / 06";
  $("questionText").textContent = questions[index];
  $("answerBox").value = answers[index];
  $("backBtn").style.visibility = index === 0 ? "hidden" : "visible";
}

function changeQuestion(direction) {
  answers[index] = $("answerBox").value;
  const box = document.querySelector(".questionWrap");
  box.style.transition = "opacity .18s ease, transform .18s ease";
  box.style.opacity = "0";
  box.style.transform = `translateY(${direction * 16}px)`;

  setTimeout(() => {
    index += direction;
    renderQuestion();
    box.style.transform = `translateY(${direction * -16}px)`;
    requestAnimationFrame(() => {
      box.style.transition = "opacity .35s ease, transform .35s ease";
      box.style.opacity = "1";
      box.style.transform = "translateY(0)";
    });
  }, 190);
}

$("lerBtn").addEventListener("click", () => {
  startMusic();
  // O nome vem primeiro. Se for "mestre", abre diretamente o arquivo privado.
  show("nameScreen");
  setTimeout(() => $("nameInput").focus(), 350);
});

$("nextBtn").addEventListener("click", async () => {
  const value = $("answerBox").value.trim();
  answers[index] = value;

  if (index < questions.length - 1) {
    changeQuestion(1);
    return;
  }

  // Sexta pergunta concluída: salva diretamente. NÃO pede o nome novamente.
  questionsCompleted = true;
  flowStage = "finish";

  const button = $("nextBtn");
  const originalText = button.textContent;
  button.disabled = true;
  button.textContent = "ENVIANDO...";

  try {
    await saveResponseToSupabase();
    show("finish");
    document.getElementById("finish").style.display = "flex";
    finishWithEffects();
  } catch (error) {
    console.error("Erro ao salvar respostas no Supabase:", error);
    alert("Não foi possível enviar suas respostas agora. Verifique a conexão e tente novamente.");
  } finally {
    button.disabled = false;
    button.textContent = originalText;
  }
});

$("backBtn").addEventListener("click", () => {
  if (index > 0) changeQuestion(-1);
});

$("nameNextBtn").addEventListener("click", async () => {
  const name = $("nameInput").value.trim();
  if (!name) {
    $("nameInput").focus();
    $("nameInput").style.borderBottomColor = "#d00000";
    setTimeout(() => $("nameInput").style.borderBottomColor = "#a00000", 700);
    return;
  }

  participantName = name;

  // A palavra "mestre" abre o ARQUIVO. O próprio ARQUIVO faz a pergunta do elemento.
  if (name.toLowerCase() === "mestre") {
    window.location.href = "arquivo.html";
    return;
  }

  // O nome é pedido SOMENTE aqui, no começo.
  flowStage = "intro";
  introFinished = false;
  introTyping = false;
  introLineIndex = 0;
  show("intro");
  typeIntro();
});

$("nameBackBtn").addEventListener("click", () => {
  if (questionsCompleted) {
    show("questions");
    renderQuestion();
  } else {
    show("cover");
  }
});

$("answerBox").addEventListener("input", e => answers[index] = e.target.value);

$("nameInput").addEventListener("input", e => participantName = e.target.value);
$("nameInput").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    $("nameNextBtn").click();
  }
});

renderQuestion();

let finalAudioCtx = null;
let heartbeatTimer = null;
let breathTimer = null;

function stopQuestionnaireMusic(){
  const music = $("localMusic");
  try { music.pause(); music.currentTime = 0; } catch(e) {}
}

function thump(ctx, when, frequency, volume, duration){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(frequency, when);
  osc.frequency.exponentialRampToValueAtTime(Math.max(38, frequency * .72), when + duration);
  gain.gain.setValueAtTime(.0001, when);
  gain.gain.exponentialRampToValueAtTime(volume, when + .018);
  gain.gain.exponentialRampToValueAtTime(.0001, when + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(when);
  osc.stop(when + duration + .01);
}

function breath(ctx, when, inhale=true){
  const duration = inhale ? 1.05 : .85;
  const bufferSize = Math.floor(ctx.sampleRate * duration);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){
    const t=i/bufferSize;
    const envelope= Math.sin(Math.PI*t) * (inhale ? .045 : .032);
    data[i]=(Math.random()*2-1)*envelope;
  }
  const source=ctx.createBufferSource();
  const filter=ctx.createBiquadFilter();
  const gain=ctx.createGain();
  filter.type="bandpass";
  filter.frequency.value=850;
  filter.Q.value=.65;
  gain.gain.value=1;
  source.buffer=buffer;
  source.connect(filter).connect(gain).connect(ctx.destination);
  source.start(when);
}

function heartbeatAndBreath(){
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C) return;
    if(finalAudioCtx) finalAudioCtx.close().catch(()=>{});
    finalAudioCtx=new C();
    const ctx=finalAudioCtx;
    if(ctx.state === "suspended") ctx.resume();

    // Batimento acelerado: dois impactos curtos a cada ~0,78 s.
    const beat=()=>{
      if(!finalAudioCtx || finalAudioCtx.state === "closed") return;
      const t=ctx.currentTime+.03;
      thump(ctx,t,74,.22,.13);
      thump(ctx,t+.105,58,.17,.15);
    };
    beat();
    heartbeatTimer=setInterval(beat,780);

    // Respiração curta e acelerada, contínua no fundo.
    let inhale=true;
    const breathe=()=>{
      if(!finalAudioCtx || finalAudioCtx.state === "closed") return;
      breath(ctx,ctx.currentTime+.02,inhale);
      inhale=!inhale;
    };
    breathe();
    breathTimer=setInterval(breathe,1100);
  }catch(e){}
}

function stopFinalAudio(){
  if(heartbeatTimer){ clearInterval(heartbeatTimer); heartbeatTimer=null; }
  if(breathTimer){ clearInterval(breathTimer); breathTimer=null; }
  if(finalAudioCtx){ finalAudioCtx.close().catch(()=>{}); finalAudioCtx=null; }
}

function finishWithEffects(){
  // Segurança: a respiração/final nunca é iniciada antes das 6 respostas.
  if (!questionsCompleted) return;
  stopQuestionnaireMusic();
  $("musicLabel").style.display="none";
  $("exitBtn").classList.add("pulsing");
  $("finalPulse").classList.add("active");
  heartbeatAndBreath();
}

const exitBtn = document.getElementById("exitBtn");
if (exitBtn) exitBtn.addEventListener("click", () => {
  stopFinalAudio();
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("blackout").classList.add("active");
  document.body.style.background = "#000";
});
</script>
</body>
</html>
