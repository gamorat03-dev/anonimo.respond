<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARQUIVO DE ALGUÉM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font-family:Georgia,serif;min-height:100vh}
main{width:min(900px,100%);margin:auto;padding:28px 18px 50px}.panel{border:1px solid #3b0d0d;background:#090909;padding:25px}
.hidden{display:none!important}h1{text-align:center;letter-spacing:5px;font-weight:400;font-size:clamp(25px,7vw,48px);margin:0}
.subtitle{text-align:center;color:#999;letter-spacing:3px;margin:10px 0 35px}
input{width:100%;padding:14px;background:#050505;color:#eee;border:1px solid #511414;font:inherit}
button{background:#130000;color:#eee;border:1px solid #7d1717;padding:12px 18px;font:inherit;cursor:pointer}
.enter{width:100%;margin-top:12px}#error{min-height:24px;color:#b72b2b;text-align:center;margin-top:12px}
.sub{text-align:center;letter-spacing:2px;color:#aaa}.small{font:13px Arial,sans-serif;color:#888}
.folder{border:1px solid #351010;background:#0a0a0a;padding:16px;margin:10px 0;cursor:pointer}
.folder:hover{border-color:#8d1d1d}.folderTitle{font-size:18px;letter-spacing:2px}
.folderMeta{font:12px Arial,sans-serif;color:#777;margin-top:7px}.status{text-align:center;padding:25px 0}
.doc{border-top:1px solid #321010;padding:22px 0}.doc h3{font-size:15px;letter-spacing:3px;color:#aaa}
.answer{white-space:pre-wrap;line-height:1.7;color:#ddd}.back{margin-bottom:20px;font-size:24px}
</style>
</head>
<body>
<main>
<section id="gate" class="panel">
<h1>ARQUIVO DE ALGUÉM</h1><div class="subtitle">REGISTROS</div>
<input id="secret" type="password" autocomplete="off" placeholder="ACESSO">
<button id="enter" class="enter">ENTRAR</button><div id="error"></div>
</section>
<section id="archive" class="panel hidden">
<h1>ARQUIVO DE ALGUÉM</h1><div class="subtitle">RESPOSTAS DOS JOGADORES</div>
<div id="folders"></div><div id="detail"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const SECRET="Morte 22";
const SUPABASE_URL="https://kaujeiodvpjjfrwqfmsx.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_nZd-iUk1cVYuk-L1YQJobA_H-nWxJ7";
let db=null;
function getDb(){if(!window.supabase)throw new Error("Biblioteca do Supabase não carregou.");if(!db)db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);return db}
function waitForSupabase(t=10000){return new Promise((resolve,reject)=>{const s=Date.now(),c=()=>{if(window.supabase)return resolve(getDb());if(Date.now()-s>=t)return reject(new Error("O Supabase não carregou a tempo."));setTimeout(c,100)};c()})}
function escapeHtml(v){return String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]))}
async function loadRecords(){
 const folders=$("folders");folders.innerHTML='<div class="status"><div class="sub">CARREGANDO REGISTROS...</div></div>';
 try{
  const query=getDb().from("respostas").select("*");
  const timeout=new Promise((_,reject)=>setTimeout(()=>reject(new Error("O Supabase não respondeu em 12 segundos.")),12000));
  const {data,error}=await Promise.race([query,timeout]);if(error)throw error;
  const records=Array.isArray(data)?data.slice():[];
  records.sort((a,b)=>(b?.criado_em?new Date(b.criado_em).getTime():0)-(a?.criado_em?new Date(a.criado_em).getTime():0));
  if(!records.length){folders.innerHTML='<div class="status"><div class="sub">NENHUM REGISTRO ENCONTRADO.</div><div class="small">A leitura funcionou, mas a tabela não retornou registros.</div></div>';return}
  window.records=records;
  folders.innerHTML=records.map((p,i)=>'<div class="folder" onclick="openPlayer('+i+')"><div class="folderTitle">'+escapeHtml(p.nome||"SEM NOME")+'</div><div class="folderMeta">REGISTRO '+String(i+1).padStart(2,"0")+(p.criado_em?" · "+new Date(p.criado_em).toLocaleString("pt-BR"):"")+'</div></div>').join("");
 }catch(error){
  console.error("ERRO AO LER REGISTROS NO SUPABASE:",error);
  const code=error?.code?"Código: "+error.code:"",msg=error?.message||String(error),details=error?.details?" · "+error.details:"",hint=error?.hint?" · "+error.hint:"";
  folders.innerHTML='<div class="status"><div class="sub">NÃO FOI POSSÍVEL CARREGAR OS REGISTROS.</div><div class="small" style="margin-top:18px;color:#b72b2b;line-height:1.8;word-break:break-word;">'+escapeHtml(code+(code?" — ":"")+msg+details+hint)+'</div><div class="small" style="margin-top:14px;">Este diagnóstico mostra o erro real da leitura. Não altere o formulário nem o banco ainda.</div></div>';
 }
}
window.openPlayer=i=>{const p=window.records[i];$("folders").classList.add("hidden");$("detail").innerHTML='<button class="back" onclick="closeDocs()">←</button>'+[1,2,3,4,5,6].map(n=>'<article class="doc"><h3>PERGUNTA '+n+'</h3><div class="answer">'+escapeHtml(p["resposta_"+n]||"")+'</div></article>').join("")};
window.closeDocs=()=>{$("detail").innerHTML="";$("folders").classList.remove("hidden")};
async function unlock(){
 const typed=$("secret").value.trim();
 if(typed.toLowerCase()!==SECRET.toLowerCase()){$("error").textContent="Acesso negado.";$("secret").value="";$("secret").focus();return}
 $("error").textContent="";$("gate").classList.add("hidden");$("archive").classList.remove("hidden");
 try{await waitForSupabase();await loadRecords()}catch(error){console.error(error);$("folders").innerHTML='<div class="status"><div class="sub">NÃO FOI POSSÍVEL CARREGAR OS REGISTROS.</div><div class="small" style="color:#b72b2b;">'+escapeHtml(error?.message||String(error))+'</div></div>'}
}
window.addEventListener("DOMContentLoaded",()=>{$("secret").focus();$("enter").onclick=unlock;$("secret").onkeydown=e=>{if(e.key==="Enter")unlock()}});
</script>
</body>
</html>
