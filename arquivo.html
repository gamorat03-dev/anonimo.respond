<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ALGUÉM — Arquivo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050303;color:#eee7df}
body{font-family:Georgia,serif;background:radial-gradient(circle at center,#210000 0,#080303 46%,#020202 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(130,0,0,.025) 4px),radial-gradient(circle at center,transparent 35%,#000 100%)}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(780px,92vw);padding:42px 30px;border:1px solid #650000;background:rgba(0,0,0,.78);box-shadow:0 0 70px rgba(150,0,0,.16),inset 0 0 40px rgba(120,0,0,.05);text-align:center}
.kicker{font-size:9px;letter-spacing:.45em;color:#806a67;margin-bottom:18px}h1{margin:0;color:#c40000;font-size:clamp(28px,7vw,48px);letter-spacing:.18em;font-weight:400}h2{color:#c40000;font-size:clamp(18px,4vw,28px);font-weight:400;letter-spacing:.08em;line-height:1.5}
.question{max-width:650px;margin:34px auto 28px;color:#ddd3ce;font-size:clamp(17px,3vw,24px);line-height:1.65}
input{width:min(520px,90%);background:transparent;color:#eee7df;border:0;border-bottom:1px solid #720000;outline:0;padding:13px 8px;text-align:center;font:20px Georgia,serif;letter-spacing:.12em;text-transform:lowercase}input:focus{border-bottom-color:#d00000;box-shadow:0 10px 25px rgba(120,0,0,.12)}
button{display:block;margin:28px auto 0;padding:12px 30px;background:#3d0000;color:#eee;border:1px solid #900000;letter-spacing:.25em;font-size:10px;cursor:pointer;transition:.25s}button:hover{background:#650000;border-color:#d00000;box-shadow:0 0 24px rgba(170,0,0,.2)}
.hidden{display:none!important}.error{height:20px;margin-top:16px;color:#b72b2b;font-size:11px;letter-spacing:.08em}
.archive{max-width:900px}.archiveHeader{border-bottom:1px solid #3b0b0b;padding-bottom:24px;margin-bottom:22px}.sub{color:#7e6c68;font-size:11px;letter-spacing:.18em}.folder{border:1px solid #3e1111;background:rgba(20,0,0,.35);padding:18px;margin:12px 0;text-align:left;cursor:pointer;transition:.25s}.folder:hover{border-color:#970000;background:rgba(100,0,0,.08);transform:translateX(3px)}.folderTitle{color:#d8ceca;letter-spacing:.08em}.folderMeta{font-size:11px;color:#786663;margin-top:7px}.doc{border-top:1px solid #351010;margin-top:24px;padding-top:22px;text-align:left}.doc h3{color:#b90000;font-size:12px;letter-spacing:.2em}.answer{white-space:pre-wrap;color:#d8cfca;line-height:1.8;font-size:15px;margin-bottom:24px}.back{margin:0 0 20px auto;background:transparent}.musicWrap{position:fixed;left:-10000px;top:-10000px;width:1px;height:1px;overflow:hidden}.small{font-size:10px;color:#6f5e5a;letter-spacing:.12em;margin-top:18px}
</style>
</head>
<body>
<div class="musicWrap" aria-hidden="true"><iframe id="music" width="1" height="1" src="https://open.spotify.com/embed/playlist/3cANnTlAqboraXX3zwnM7A?utm_source=generator&theme=0" title="Heilag Vagga — Morte" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe></div>
<div class="wrap">
  <section id="gate" class="card">
    <div class="kicker">ARQUIVO</div>
    <h1>SENHA</h1>
    <div class="question">A porta se abre apenas para aqueles que conhecem a palavra que deve ser dita.</div>
    <input id="secret" type="password" autocomplete="off" spellcheck="false" aria-label="Senha">
    <button id="enter">ENTRAR</button>
    <div id="error" class="error"></div>
  </section>

  <section id="archive" class="card archive hidden">
    <div class="archiveHeader"><div class="kicker">ARQUIVO DE ALGUÉM</div><h1>REGISTROS</h1><div class="sub">RESPOSTAS DOS JOGADORES</div></div>
    <div id="folders"><div class="sub">CARREGANDO REGISTROS...</div></div>
    <div id="detail"></div>
  </section>
</div>
<script>
const $=id=>document.getElementById(id);
const SECRET="Morte 22";
const SUPABASE_URL="https://kaujeiodvpjjfrwqfmsx.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_nZd-iUk1cVYuk-L1YQJobA_H-nWxJ7";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
function playDeath(){}
window.addEventListener("DOMContentLoaded",()=>$("secret").focus());
$("enter").addEventListener("click",unlock);
$("secret").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
async function unlock(){
  if($("secret").value.trim().toLowerCase()!==SECRET.toLowerCase()){$("error").textContent="Acesso negado.";$("secret").value="";$("secret").focus();return;}
  $("error").textContent="";$("gate").classList.add("hidden");$("archive").classList.remove("hidden");
  playDeath();
  await loadRecords();
}
function escapeHtml(v){return String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));}
async function loadRecords(){
  const {data,error}=await db.from("respostas").select("id,nome,criado_em,resposta_1,resposta_2,resposta_3,resposta_4,resposta_5,resposta_6").order("criado_em",{ascending:false});
  if(error){$("folders").innerHTML='<div class="sub">NÃO FOI POSSÍVEL CARREGAR OS REGISTROS.</div><div class="small">Verifique a permissão de leitura da tabela respostas no Supabase.</div>';console.error(error);return;}
  if(!data?.length){$("folders").innerHTML='<div class="sub">NENHUM REGISTRO ENCONTRADO.</div>';return;}
  window.records=data;
  $("folders").innerHTML=data.map((p,i)=>`<div class="folder" onclick="openPlayer(${i})"><div class="folderTitle">${escapeHtml(p.nome||"SEM NOME")}</div><div class="folderMeta">REGISTRO ${String(i+1).padStart(2,"0")}${p.criado_em?" · "+new Date(p.criado_em).toLocaleString("pt-BR"):""}</div></div>`).join("");
}
window.openPlayer=function(i){
  const p=window.records[i];
  $("folders").classList.add("hidden");
  $("detail").innerHTML=`<button class="back" onclick="closeDocs()">← VOLTAR AO ARQUIVO</button>`+
  [1,2,3,4,5,6].map(n=>`<article class="doc"><h3>DOCUMENTO 0${n}</h3><div class="answer">${escapeHtml(p["resposta_"+n]||"")}</div></article>`).join("");
};
window.closeDocs=function(){$("detail").innerHTML="";$("folders").classList.remove("hidden")};
</script>

</body>
</html>
